name: Docker Build

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout in opf/op-blocknote-hocuspocus (e.g., refs/tags/v17.1.0, refs/heads/dev)"
        required: true
        type: string
      tags:
        description: "Newline-separated full Docker image tags (e.g., openproject/hocuspocus:17.1.0)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: opf/op-blocknote-hocuspocus
          ref: ${{ inputs.ref }}

      - name: Patch package.json version with short SHA
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          sed -ri "s/\"version\": \"(.*)\"/\"version\": \"\1-$SHORT_SHA\"/g" package.json

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ inputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
